# Pushing a tag such as v0.2.0 builds every platform and, once all of them
# have succeeded, publishes one GitHub release. The tag must match the version
# in mygo.json; the phone apps take their version from it too.
#
# Running this workflow by hand builds everything and publishes nothing: the
# files stay on the run as artifacts, with an ad hoc signature on macOS and the
# debug key on Android, which checks that all of it still builds on the runners.
#
# A tag needs these repository secrets:
#   MACOS_CERTIFICATE_P12        Developer ID certificate, base64
#   MACOS_CERTIFICATE_PASSWORD
#   NOTARY_KEY_P8                App Store Connect key, the text of the .p8
#   NOTARY_KEY_ID
#   NOTARY_ISSUER
#   ANDROID_KEYSTORE_BASE64      release keystore, base64
#   ANDROID_KEYSTORE_PASSWORD    no backslashes: it goes in a .properties file
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PACKAGES_GPG_PRIVATE_KEY     armored, no passphrase; signs the rpms and the
#                                APT and DNF repositories
#   PACKAGES_DEPLOY_KEY          SSH deploy key with write access to 21stware/packages
#   HOMEBREW_TAP_DEPLOY_KEY      the same for 21stware/homebrew-tap
#   AUR_SSH_PRIVATE_KEY          of the AUR account that maintains bowel-bin
#   MYGO_UPDATER_PRIVATE_KEY     contents of mygo-update.key (mygo keygen)
#
# After the release, one job each updates the APT and DNF repositories on the
# Pages site of 21stware/packages, the Homebrew tap and the AUR. They are
# separate so that one failing leaves the others done and can be re-run alone.
# The AUR job runs once the repository variable AUR_ENABLED is true: it needs an
# AUR account that holds the public half of AUR_SSH_PRIVATE_KEY.
#
# MYGO_UPDATER_PRIVATE_KEY signs the updates that installed apps download
# (app_update.go): the archive and manifest of each desktop platform, which the
# release carries. It is the secret half of updates.publicKey in mygo.json.
#
# iOS is not released yet and builds, unsigned, only when run by hand: it links
# mihomo (GPL-3.0) into the app, which the PolyForm license and the README's
# "does not link it" do not cover.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name == 'push' }}
  FLUTTER_VERSION: 3.47.9

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=$(jq -r .version mygo.json)" >> "$GITHUB_OUTPUT"

      - name: Check the tag and the signing secrets
        if: env.PUBLISH == 'true'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
          PACKAGES_DEPLOY_KEY: ${{ secrets.PACKAGES_DEPLOY_KEY }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match version $VERSION in mygo.json"
            exit 1
          fi
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER \
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
            PACKAGES_GPG_PRIVATE_KEY PACKAGES_DEPLOY_KEY HOMEBREW_TAP_DEPLOY_KEY AUR_SSH_PRIVATE_KEY MYGO_UPDATER_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit "$missing"

  macos:
    needs: check
    # Compiling the Icon Composer app icon needs Xcode 26 or later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fetch the mihomo core and geo data
        env:
          GH_TOKEN: ${{ github.token }}
          MIHOMO_SOURCE_DIR: dist
        run: ./scripts/fetch-core.sh

      - name: Import the Developer ID certificate
        if: env.PUBLISH == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"

      - name: Build, sign and notarize
        if: env.PUBLISH == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY"
          ./scripts/release.sh
          rm "$NOTARY_KEY"

      - name: Build without publishing
        if: env.PUBLISH != 'true'
        run: go tool mygo build -platform darwin/arm64 -skip-notarize -sign - .

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          path: |
            build/darwin-arm64/bowel-*-arm64.dmg
            build/darwin-arm64/bowel-*-darwin-arm64.tar.gz
            build/darwin-arm64/bowel-*.delta
            build/darwin-arm64/update-darwin-arm64.json
            dist/mihomo-*-source.tar.gz

  desktop:
    needs: check
    name: ${{ matrix.goos }} ${{ matrix.goarch }}
    # MyGo needs no cgo, so Ubuntu builds the Windows apps as well.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install NSIS, for the Windows installer
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Fetch the mihomo core and geo data
        env:
          GH_TOKEN: ${{ github.token }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: ./scripts/fetch-core.sh

      - name: Build
        env:
          # Only a release signs updates: a run by hand publishes nothing.
          MYGO_UPDATER_PRIVATE_KEY: ${{ env.PUBLISH == 'true' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: go tool mygo build -platform "${{ matrix.goos }}/${{ matrix.goarch }}" .

      - name: Add the removal script to the Debian package and repackage it as an rpm
        if: matrix.goos == 'linux'
        env:
          DIR: build/linux-${{ matrix.goarch }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          ./scripts/add-deb-postrm.sh "$DIR"/bowel_*.deb
          ./scripts/build-rpm.sh "$DIR"/bowel_*.deb "$DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            build/*/bowel-setup-*.exe
            build/*/install.ps1
            build/linux-amd64/install.sh
            build/*/bowel-*-linux-*.tar.gz
            build/*/bowel-*-windows-*.tar.gz
            build/*/bowel-*.delta
            build/*/update-*.json
            build/*/bowel_*.deb
            build/*/bowel-*.rpm

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: mobile/bridge/go.mod
          cache-dependency-path: mobile/bridge/go.sum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install the NDK that mobile/android/build.sh pins
        run: |
          ndk="$(sed -n 's/^NDK_VERSION=//p' mobile/android/build.sh)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" >/dev/null

      - name: Fetch the geo data
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-core.sh

      - name: Install gomobile
        working-directory: mobile/bridge
        run: |
          version="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@$version" "golang.org/x/mobile/cmd/gobind@$version"
          gomobile init

      - name: Build mihomo, the launcher and the bridge
        run: ./mobile/android/build.sh

      - name: Install the release key
        if: env.PUBLISH == 'true'
        working-directory: mobile/flutter/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > key.properties

      - name: Build the app
        working-directory: mobile/flutter
        run: |
          flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk "bowel-$VERSION-android-arm64.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          if-no-files-found: error
          path: mobile/flutter/bowel-*-android-arm64.apk

  ios:
    if: github.event_name != 'push'
    needs: check
    runs-on: macos-26
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: mobile/bridge/go.mod
          cache-dependency-path: mobile/bridge/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch the geo data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/fetch-core.sh
          cp -R resources/geo mobile/flutter/ios/Runner/geo

      - name: Install gomobile
        working-directory: mobile/bridge
        run: |
          version="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@$version" "golang.org/x/mobile/cmd/gobind@$version"
          gomobile init

      - name: Build the bridge and the tunnel
        run: ./mobile/bridge/build.sh

      - name: Build the app, unsigned
        working-directory: mobile/flutter
        run: |
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "bowel-$VERSION-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          if-no-files-found: error
          path: mobile/flutter/bowel-*-ios-unsigned.ipa

  publish:
    if: github.event_name == 'push'
    needs: [check, macos, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release

      - name: Install rpmsign
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Sign the rpms and write SHA256SUMS
        env:
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: ./scripts/prepare-release.sh release dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "bowel $TAG"

  linux-repos:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes
    steps:
      - uses: actions/checkout@v7

      - name: Install the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.PACKAGES_DEPLOY_KEY }}
        run: ./scripts/install-deploy-key.sh

      - name: Install the repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c

      - name: Download the packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --pattern '*.deb' --pattern '*.rpm' --dir incoming

      - name: Check out the current repositories
        run: git clone --depth 1 --branch gh-pages git@github.com:21stware/packages.git pkgsite

      - name: Add the release
        env:
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: ./scripts/update-package-repo.sh incoming pkgsite

      # One commit, force-pushed: a history of packages would grow without end.
      - name: Publish
        working-directory: pkgsite
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git add -A
          git commit -m "bowel $TAG"
          git push --force origin publish:gh-pages

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes
    steps:
      - uses: actions/checkout@v7

      - name: Install the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: ./scripts/install-deploy-key.sh

      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS
          sha="$(awk -v f="bowel-$VERSION-arm64.dmg" '$2 == f { print $1 }' SHA256SUMS)"
          test -n "$sha"
          git clone git@github.com:21stware/homebrew-tap.git tap
          mkdir -p tap/Casks
          ./scripts/render-cask.sh "$VERSION" "$sha" >tap/Casks/bowel.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/bowel.rb
          git diff --cached --quiet || { git commit -m "bowel $VERSION" && git push origin HEAD:main; }

  aur:
    if: vars.AUR_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trust the AUR's SSH host and install the key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as aur.archlinux.org lists it.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' >> ~/.ssh/known_hosts
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

      - name: Update bowel-bin
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS
          sum() { awk -v f="bowel_${VERSION}_$1.deb" '$2 == f { print $1 }' SHA256SUMS; }
          amd64="$(sum amd64)"
          arm64="$(sum arm64)"
          test -n "$amd64" && test -n "$arm64"
          git clone ssh://aur@aur.archlinux.org/bowel-bin.git aur
          ./scripts/render-aur.sh "$VERSION" "$amd64" "$arm64" aur
          cd aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO bowel-bin.install
          git diff --cached --quiet || { git commit -m "bowel $VERSION" && git push origin HEAD:master; }
