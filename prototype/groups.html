<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Moho · 路由组原型</title>
<style>
:root {
  color-scheme: light;
  --paper: #f6f4ef; --paper-2: #efece5; --card: #fbfaf7; --sheet: #fdfcf9;
  --ink: #151413; --ink-2: #3b3936; --mute: #8b877e; --faint: #c2bdb2;
  --hair: rgba(21,20,19,.11); --hair-2: rgba(21,20,19,.06); --hover: rgba(21,20,19,.035);
  --signal: #e2462b; --good: #2c9a5a; --warn: #cf8a12;
  --r-default: #2f5bea; --r-ai: #7a4de0; --r-media: #e0457b; --r-dev: #0e9db1; --r-direct: #9a968c; --r-c1: #d98a00; --r-c2: #2e9e5b; --r-c3: #e8663a; --r-c4: #a33fa8; --r-c5: #3a86b7;
  --serif: "Songti SC", "STSongti-SC-Regular", "New York", ui-serif, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --desk: radial-gradient(120% 100% at 30% 0%, #d8d3c8 0%, #b9b3a6 100%);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
:root.dark {
  color-scheme: dark;
  --paper: #141413; --paper-2: #1b1a19; --card: #1d1c1a; --sheet: #1f1e1c;
  --ink: #f1eee7; --ink-2: #cfcbc2; --mute: #8e8a81; --faint: #4f4c46;
  --hair: rgba(241,238,231,.11); --hair-2: rgba(241,238,231,.06); --hover: rgba(241,238,231,.04);
  --signal: #ff5a3c; --good: #3fc07a; --warn: #f0a630;
  --r-default: #5b80ff; --r-ai: #9a74ff; --r-media: #ff5f93; --r-dev: #22c3d6; --r-direct: #77736b; --r-c1: #f0a92b; --r-c2: #4cc37e; --r-c3: #ff8a5c; --r-c4: #cf6bd4; --r-c5: #62abd9;
  --desk: radial-gradient(120% 100% at 30% 0%, #34312c 0%, #191816 100%);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); color: var(--ink); overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.stage { position: absolute; inset: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
.kicker { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; color: var(--mute); }
.kicker b { color: var(--ink); font-weight: 700; }
.muted { color: var(--mute); }

/* ---------- shimmer: anything that is being applied ---------- */
@keyframes shim { to { background-position: -200% 0; } }
.shimmer { background: linear-gradient(90deg, var(--faint) 0%, var(--ink) 40%, var(--faint) 80%) 0 0 / 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shim 1.1s linear infinite; }
.skel { background: linear-gradient(90deg, var(--hair-2) 0%, var(--hair) 40%, var(--hair-2) 80%) 0 0 / 200% 100%; animation: shim 1.1s linear infinite; border-radius: 4px; color: transparent !important; }

/* ---------- window ---------- */
.window { position: absolute; left: 190px; top: 50px; width: 1060px; height: 730px; background: var(--paper); border-radius: 12px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.2); display: flex; flex-direction: column; }
.titlebar { height: 50px; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 14px 0 16px; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; }
/* one solid control: the active tab is an ink pill, no underline */
.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--hair-2); box-shadow: inset 0 0 0 1px var(--hair-2); font-size: 13px; }
.tab { color: var(--ink-2); padding: 4px 18px; border-radius: 7px; position: relative; display: inline-flex; gap: 6px; align-items: center; font-weight: 600; transition: background .2s, color .2s; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--ink); color: var(--paper); }
.tab .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
.tb-r { display: flex; justify-content: flex-end; gap: 14px; align-items: center; font-size: 11.5px; color: var(--mute); }
.state-mini { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: var(--hair-2); box-shadow: inset 0 0 0 1px var(--hair-2); color: var(--ink-2); font-weight: 600; font-size: 12px; }
.state-mini i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.state-mini.degraded i { background: var(--warn); } .state-mini.error i { background: var(--signal); } .state-mini.off i { background: var(--faint); }

.breaking { display: flex; align-items: center; gap: 14px; padding: 8px 26px; border-bottom: 1px solid var(--hair); font-size: 12.5px; flex: none; }
.breaking .label { font-size: 10px; font-weight: 800; letter-spacing: .14em; color: #fff; background: var(--signal); padding: 2px 7px; }
.breaking.warn .label { background: var(--warn); }
.breaking .act { margin-left: auto; font-weight: 600; border-bottom: 1.5px solid currentColor; }
.main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- cards (sections that expand into a drawer) ---------- */
.card { position: relative; cursor: pointer; transition: background .15s; }
.card:hover { background: var(--hover); }
.card.active { background: var(--paper-2); }
.expand { position: absolute; top: 14px; right: 18px; font-size: 11px; color: var(--mute); opacity: 0; transition: opacity .15s; display: inline-flex; gap: 4px; align-items: center; }
.card:hover .expand, .card.active .expand { opacity: 1; }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: 430px 1fr; flex: none; height: 318px; border-bottom: 1px solid var(--hair); }
.hero-text { padding: 24px 26px 22px; display: flex; flex-direction: column; border-right: 1px solid var(--hair); }
.headline { margin: 12px 0 0; font: 700 48px/1.05 var(--serif); letter-spacing: -.02em; }
.headline .flag { font-size: 36px; vertical-align: 4px; margin-right: 6px; }
.deck { margin-top: 10px; font-size: 13.5px; color: var(--ink-2); line-height: 1.6; min-height: 44px; }
.deck b { color: var(--ink); font-weight: 600; }
.loc { display: inline-flex; gap: 4px; align-items: center; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; vertical-align: 2px; }
.loc.probe { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.loc.name { color: var(--mute); background: var(--hair-2); }
.loc.unknown { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.lat-big { display: flex; align-items: baseline; gap: 18px; margin-top: auto; }
.lat-big .v { font: 600 38px/1 var(--sans); letter-spacing: -.03em; }
.lat-big .v small { font-size: 14px; color: var(--mute); font-weight: 500; letter-spacing: 0; margin-left: 3px; }
.lat-big .stab { display: grid; gap: 4px; }
.lat-big .stab span { font-size: 10.5px; color: var(--mute); letter-spacing: .06em; }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 20px; }
.bars i { width: 5px; background: var(--ink); opacity: .7; }
.hero-actions { display: flex; gap: 10px; margin-top: 16px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 12.5px; }
.pill.ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); font-weight: 500; }
.pill.ghost.on { box-shadow: inset 0 0 0 1.5px var(--ink); }
.pill.sm { padding: 4px 11px; font-size: 12px; }
.gdot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.mapwrap { position: relative; }
.mapwrap canvas { width: 100%; height: 100%; display: block; }
.map-cap { position: absolute; left: 20px; top: 16px; font-size: 11px; color: var(--mute); line-height: 1.5; max-width: 420px; }
.map-cap b { color: var(--ink); }
.map-legend { position: absolute; right: 20px; bottom: 14px; display: grid; gap: 3px; font-size: 11px; color: var(--ink-2); text-align: right; }
.map-legend span { display: inline-flex; gap: 6px; align-items: center; justify-content: flex-end; }
.map-legend i { width: 14px; height: 2px; border-radius: 1px; }

/* ---------- control row ---------- */
.controls { display: grid; grid-template-columns: 1.1fr 1fr 1.3fr; flex: none; border-bottom: 1px solid var(--hair); }
.controls .card { padding: 16px 26px 18px; }
.controls .card + .card, .now .card + .card { border-left: 1px solid var(--hair); }
.words { display: flex; gap: 18px; align-items: baseline; margin-top: 10px; }
.word { font: 600 25px/1.1 var(--serif); color: var(--faint); position: relative; }
.word:hover { color: var(--ink-2); }
.word.on { color: var(--ink); }
.word.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 3px; background: var(--ink); }
.card p { margin: 14px 0 0; font-size: 12px; color: var(--mute); line-height: 1.55; }
.card p b { color: var(--ink-2); font-weight: 600; }
.entry { display: grid; grid-template-columns: 1fr auto; align-items: baseline; padding: 6px 0; width: 100%; }
.entry + .entry { border-top: 1px dashed var(--hair); }
.entry .w { font: 600 20px/1.2 var(--serif); color: var(--faint); }
.entry.on .w, .entry.bad .w { color: var(--ink); }
.entry .s { font-size: 11.5px; color: var(--mute); display: inline-flex; gap: 6px; align-items: center; }
.entry .s i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.entry.on .s i { background: var(--good); }
.entry.bad .s { color: var(--signal); } .entry.bad .s i { background: var(--signal); }
.route { display: grid; grid-template-columns: 8px 58px 1fr auto; gap: 10px; align-items: center; padding: 4px 0; width: 100%; }
.route + .route { border-top: 1px dashed var(--hair); }
.sw { width: 8px; height: 8px; border-radius: 2px; flex: none; display: inline-block; }
.route .rn { font-weight: 600; font-size: 12.5px; }
.route .ex { font: 600 15px/1.25 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.route .ms { font-size: 11.5px; color: var(--mute); }
.route:hover .ex { text-decoration: underline; text-underline-offset: 3px; }
.route.dim { opacity: .35; }

/* ---------- now row ---------- */
.now { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.1fr 1fr 1.3fr; }
.now .card { padding: 14px 26px 0; min-width: 0; overflow: hidden; }
.speed { display: flex; gap: 20px; align-items: baseline; margin-top: 8px; }
.speed .v { font: 600 23px/1 var(--sans); letter-spacing: -.02em; }
.speed .v small { font-size: 11.5px; color: var(--mute); font-weight: 500; margin-left: 2px; letter-spacing: 0; }
.speed .v.u { font-size: 15px; color: var(--ink-2); }
canvas.spark { width: 100%; height: 44px; display: block; margin-top: 10px; }
.foot { font-size: 11px; color: var(--mute); margin-top: 6px; display: flex; justify-content: space-between; }
.apps { margin-top: 8px; display: grid; gap: 4px; }
.app { display: grid; grid-template-columns: 1fr 64px 66px; gap: 10px; align-items: center; font-size: 12px; }
.app .an { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app .an small { color: var(--mute); margin-left: 6px; }
.bar { height: 3px; background: var(--hair); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; }
.app .av { text-align: right; color: var(--ink-2); }
.ticker { margin-top: 8px; display: grid; gap: 5px; font-size: 11.5px; }
.tk { display: grid; grid-template-columns: 40px 1fr; gap: 8px; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.tk span:last-child { overflow: hidden; text-overflow: ellipsis; }
.tk.new { animation: tkin .4s ease; }
.tk span:first-child { color: var(--faint); }
.tk.bad { color: var(--signal); }
@keyframes tkin { from { opacity: 0; transform: translateY(-4px); } }

/* ---------- drawer ---------- */
.drawer { position: absolute; left: 0; right: 0; bottom: 0; top: 296px; background: var(--sheet); border-radius: 16px 16px 0 0; box-shadow: 0 -18px 50px rgba(0,0,0,.16), 0 -.5px 0 var(--hair); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; z-index: 4; }
.drawer.open { transform: none; }
.drawer .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--hair); margin: 8px auto 0; flex: none; }
.dr-h { display: flex; align-items: center; gap: 14px; padding: 8px 26px 12px; border-bottom: 1px solid var(--hair); flex: none; }
.dr-h h3 { margin: 0; font: 700 22px/1.2 var(--serif); display: inline-flex; gap: 10px; align-items: center; }
.dr-h .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.dr-h .x { font-size: 18px; color: var(--mute); width: 26px; text-align: center; }
.dr-body { flex: 1; min-height: 0; overflow: auto; padding: 6px 26px 18px; }
.seg { display: inline-flex; background: var(--hair-2); border-radius: 8px; padding: 2px; }
.seg button { padding: 3px 11px; border-radius: 6px; font-size: 12px; color: var(--ink-2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.chips { display: flex; gap: 14px; align-items: center; font-size: 12px; flex-wrap: wrap; }
.chips button { color: var(--mute); display: inline-flex; gap: 5px; align-items: center; }
.chips button.on { color: var(--ink); font-weight: 600; }
.search { border: 0; border-bottom: 1px solid var(--hair); background: none; padding: 4px 2px; outline: none; width: 220px; }
.search:focus { border-color: var(--ink); }
.toolrow { display: flex; gap: 18px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair-2); }
.toolrow .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.nodes { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.nrow { display: grid; grid-template-columns: 22px 1fr 70px 52px 16px; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--hair-2); border-radius: 6px; }
.nrow:hover { background: var(--hover); }
.nrow.on { background: var(--ink); color: var(--paper); }
.nrow.on .meta, .nrow.on .ms { color: color-mix(in srgb, var(--paper) 70%, transparent) !important; }
.nrow.on .bars i { background: var(--paper); }
.nrow .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nrow .meta { display: block; font-size: 11px; color: var(--mute); font-weight: 400; margin-top: 1px; }
.nrow .bars { height: 14px; gap: 2px; }
.nrow .bars i { width: 3px; }
.nrow .ms { text-align: right; font-size: 12px; }
.nrow .ck { font-size: 12px; }
.dsec { padding: 14px 0; border-bottom: 1px solid var(--hair-2); display: grid; grid-template-columns: 180px 1fr auto; gap: 18px; align-items: start; }
.dsec h4 { margin: 0; font: 700 18px/1.3 var(--serif); }
.dsec h4 small { display: block; font: 500 11.5px var(--sans); color: var(--mute); margin-top: 3px; }
.dsec .kv { display: grid; grid-template-columns: 110px 1fr; gap: 5px 12px; font-size: 12px; }
.dsec .kv span:nth-child(odd) { color: var(--mute); }
.toggle { width: 34px; height: 20px; border-radius: 10px; background: var(--hair); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.toggle.on { background: var(--good); } .toggle.on::after { left: 16px; }
.toggle.busy { opacity: .6; }
.rlist .rr { display: grid; grid-template-columns: 10px 90px 1fr 190px 70px 60px 14px; gap: 14px; align-items: center; padding: 11px 6px; border-bottom: 1px solid var(--hair-2); border-radius: 6px; }
.rlist .rr:hover { background: var(--hover); }
.rr .rn { font: 700 16px var(--serif); }
.rr .rules { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr .ex { font-weight: 600; }
.big-chart { width: 100%; height: 170px; display: block; margin-top: 12px; }

/* ---------- activity page ---------- */
.p-head { padding: 18px 26px 12px; display: flex; align-items: flex-end; gap: 18px; flex: none; }
.p-head h2 { margin: 4px 0 0; font: 700 34px/1 var(--serif); letter-spacing: -.02em; }
.p-head h2 small { font: 500 13px var(--sans); color: var(--mute); margin-left: 12px; letter-spacing: 0; }
.p-head .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.subtabs { display: flex; gap: 18px; font-size: 13px; }
.subtabs button { color: var(--mute); padding-bottom: 3px; border-bottom: 1.5px solid transparent; }
.subtabs button.on { color: var(--ink); font-weight: 600; border-color: var(--ink); }
.qbar { padding: 0 26px; flex: none; border-bottom: 1px solid var(--hair); }
.qbar .q1 { display: flex; gap: 14px; align-items: center; padding: 8px 0; }
.qbar .q2 { display: flex; gap: 16px; align-items: center; padding: 6px 0 10px; }
.qinput { flex: 1; display: flex; align-items: center; gap: 8px; border: 1px solid var(--hair); border-radius: 9px; padding: 6px 10px; background: var(--card); }
.qinput input { flex: 1; border: 0; background: none; outline: none; }
.qinput .hint { font: 11px var(--mono); color: var(--mute); }
select.sel { border: 1px solid var(--hair); background: var(--card); border-radius: 7px; padding: 3px 6px; font-size: 12px; }
.btn { padding: 5px 11px; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--hair); font-size: 12px; font-weight: 500; white-space: nowrap; }
.btn:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.btn.danger { color: var(--signal); }
.btn.danger.armed { background: var(--signal); color: #fff; box-shadow: none; }
.tbl { flex: 1; min-height: 0; overflow: auto; padding: 0 26px 16px; }
.tr { display: grid; grid-template-columns: 12px 64px minmax(170px, 1.6fr) 38px minmax(120px, 1.1fr) minmax(130px, 1.2fr) 70px 64px 64px 52px 22px; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--hair-2); font-size: 12px; cursor: pointer; }
.tr:hover { background: var(--hover); }
.tr.h { position: sticky; top: 0; background: var(--paper); z-index: 1; font-size: 10.5px; letter-spacing: .08em; color: var(--mute); font-weight: 600; cursor: default; }
.tr.h button { color: inherit; font-weight: inherit; }
.tr.h button.sorted { color: var(--ink); }
.tr .st { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.tr .st.closed { background: var(--faint); } .tr .st.failed { background: var(--signal); }
.tr .host { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr .host small { color: var(--mute); font-weight: 400; }
.tr .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.tr .rule { color: var(--mute); font-size: 11.5px; }
.tr .via { display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
.tr.closed { color: var(--mute); } .tr.closed .host { color: var(--ink-2); }
.tr.failed .via span, .tr.failed .t { color: var(--signal); }
.tr .x { color: var(--mute); font-size: 15px; text-align: center; }
.tr .x:hover { color: var(--signal); }
.tr.open { background: var(--paper-2); }
.detail { background: var(--paper-2); padding: 12px 18px 16px 30px; border-bottom: 1px solid var(--hair); display: grid; grid-template-columns: 1fr 1fr auto; gap: 18px; font-size: 12px; }
.detail .kv { display: grid; grid-template-columns: 76px 1fr; gap: 4px 12px; align-content: start; }
.detail .kv > span:nth-child(odd) { color: var(--mute); }
.detail .kv > span:nth-child(even) { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
.chain { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-weight: 600; font-family: var(--sans) !important; }
.chain .arr { color: var(--faint); }
.detail .acts { display: grid; gap: 6px; align-content: start; }
.logl { display: grid; grid-template-columns: 64px 44px 1fr; gap: 12px; padding: 5px 4px; border-bottom: 1px solid var(--hair-2); font: 11.5px/1.5 var(--mono); }
.logl .lv { font-weight: 700; } .lv.w { color: var(--warn); } .lv.e { color: var(--signal); } .lv.i { color: var(--mute); } .lv.d { color: var(--faint); }
.live { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 1.6s infinite; }
.live.paused i { background: var(--faint); animation: none; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- provider page ---------- */
.addbar { margin: 0 26px; padding: 12px 0 14px; border-bottom: 1px solid var(--hair); flex: none; display: grid; gap: 8px; }
.addbar .row { display: flex; gap: 10px; }
.addbar input { flex: 1; border: 1px solid var(--hair); background: var(--card); border-radius: 10px; padding: 10px 12px; outline: none; }
.addbar input:focus { border-color: var(--ink); }
.detect { font-size: 12px; color: var(--mute); }
.detect b { color: var(--ink); }
.plist { flex: 1; overflow: auto; padding: 0 26px 16px; }

/* ==================================================================
   Board: the whole home page is one grid. Expanding a cell animates the
   grid's tracks, so the cell grows in place and every other cell is
   squeezed — narrower if it shares the row, shorter if it shares the
   column, both otherwise. Each cell has three views that cross-fade:
   normal (fixed size, never reflows), compact (when squeezed), detail.
================================================================== */
:root { --morph: .56s cubic-bezier(.32,.86,.22,1); }
.board { flex: 1; min-height: 0; display: grid; gap: 1px; background: var(--hair);
  grid-template-columns: minmax(0, 400fr) minmax(0, 330fr) minmax(0, 330fr);
  grid-template-rows: minmax(0, 318fr) minmax(0, 150fr) minmax(0, 218fr);
  transition: grid-template-columns var(--morph), grid-template-rows var(--morph); }
.cell { background: var(--paper); position: relative; overflow: hidden; min-width: 0; min-height: 0; cursor: pointer; transition: background .2s; }

.cell[data-v="expanded"] { cursor: default; background: var(--sheet); }
.cell[data-cell="map"] { cursor: zoom-in; }
.vw { position: absolute; visibility: hidden; pointer-events: none; }
.v-normal { left: 0; top: 0; }
.v-compact, .v-detail { inset: 0; }
/* Views switch instantly: no cross-fade. The new view is revealed by the

  const top = scroller?.scrollTop;

  const pos = focused ? document.activeElement.selectionStart : 0;
  el.innerHTML = html;
  viewCache.set(key, html);
  if (top) { const s = el.querySelector(".det-b"); if (s) s.scrollTop = top; }

function updateBoard() {

      deck = `${locating ? `<span class="shimmer">正在实测出口位置…</span>` : `${placeName(ex)} ${locTag(ex)}`} · ${ex.proto} · 来自 <b>${prov(ex.prov).name}</b>，<b>${esc(policyWord(r0))}</b>。${S.mode === "global" ? "全局模式下<b>所有流量</b>都从这里出去。" : `没命中其他规则的流量从这里出去，约占 <b>${Math.round(r0.share * 100)}%</b>。`}`;
    }
    if (off) return {
      normal: `<div class="pad hero-pad off-hero">
        <div class="kicker">MOHO</div>
        <h1 class="headline" data-m="exit-default">未接管</h1>
        <div class="deck">所有应用都直接连接互联网，流量不经过 Moho。</div>
        <div class="choose">
          <button class="choice ${busy("entry:sys") ? "busy" : ""}" data-entry="sys"><b class="${busy("entry:sys") ? "shimmer" : ""}">系统代理</b><span>${busy("entry:sys") ? "正在接管…" : "浏览器和大多数应用 · 推荐"}</span></button>
          <button class="choice ${busy("entry:tun") ? "busy" : ""}" data-entry="tun"><b class="${busy("entry:tun") ? "shimmer" : ""}">TUN</b><span>${busy("entry:tun") ? (S.tunInstalled ? "正在接管…" : "正在安装服务…") : "所有应用 · 首次需安装服务"}</span></button>
        </div>
        <div class="muted" style="font-size:11.5px;margin-top:14px">上次使用：系统代理 · 机场 A · 香港 03 IPLC</div>
      </div>`,
      compact: () => "", detail: "",
    };
    return {
      normal: `<div class="pad hero-pad">
        <div class="kicker" data-m="k-hero">当前出口 · <b>${S.mode === "global" ? "全局" : "默认路由组"}</b></div>
        <h1 class="headline ${switching ? "shimmer" : ""}" data-m="exit-default">${headline}</h1>
        <div class="deck">${switching ? `<span class="shimmer">正在切换并测速…</span>` : deck}</div>
        ${ex ? `${r0.broken ? "" : `<div class="lat-big"><span class="v num ${switching ? "skel" : ""}" style="color:${tone(ex.ms)}">${ex.ms > 0 ? `${ex.ms}<small>ms</small>` : "超时"}</span>
          <span class="stab"><span>最近 12 次测速</span><span class="bars">${stab(ex.ms)}</span></span></div>`}
        <div class="hero-actions">
          <button class="pill" data-expand="hero">换节点</button>
          <button class="pill ghost on" data-expand="hero"><span class="gdot"></span>${esc(policyWord(r0))}</button>
        </div>` : ""}
      </div>`,
      compact: (v) => cmp(v, "hero", "当前出口", off ? "未接管" : S.mode === "direct" ? "直接连接" : exitText(r0), {
        key: "exit-default", cls: switching ? "shimmer" : "",
        sub: ex ? `<span style="color:${tone(ex.ms)}">${ex.ms} ms</span> · ${placeName(ex)} · ${ex.proto}` : "",
        list: ex ? `<span>来自 ${prov(ex.prov).name}</span><span>${esc(policyWord(r0))}</span>` : "" }),
      detail: `<div class="det">${detHead("当前出口 · 默认路由组 · 选择出口", `${ex ? `<span class="${switching ? "shimmer" : ""}" data-m="exit-default">${exitText(r0)}</span>` : "选择出口"}`, autoSeg("default"), "k-hero")}
        <div class="det-b">${nodePicker("default")}</div></div>`,
    };
  },

  map() {
    const off = !takeoverOn();
    const lines = ROUTES.filter((r) => !r.direct && active(r.id));
    return {
      normal: `<div class="map-cap">${off ? "开始接管后，这里会画出流量去往的出口。" : `<b>从你出发的 ${lines.length} 条线路</b>　线越粗流量越大，光点是正在传输的数据。`}</div>
        <div class="map-legend">${ROUTES.filter((r) => !r.direct).map((r) => `<span style="opacity:${active(r.id) ? 1 : .35}">${r.name}<i style="background:var(${r.color})"></i></span>`).join("")}</div>`,
      compact: () => "",
      detail: `<div class="map-cap" style="pointer-events:auto"><b>出口地图</b>　点任一路由换节点 · 再点地图收起</div>
        <div class="map-side">${ROUTES.filter((r) => !r.direct).map((r) => { const n = node(r.node); return `
          <button class="ms-row" data-expand="routes" data-sub="${r.id}" style="opacity:${active(r.id) ? 1 : .4}">
            <span class="sw" style="background:var(${r.color})"></span>
            <span><b>${flag(n)} ${n.name}</b><span class="muted">${r.name} · ${placeName(n)} ${locTag(n)}</span></span>
            <span class="num" style="color:${tone(n.ms)}">${n.ms} ms<br><span class="muted">${Math.round(r.share * 100)}%</span></span></button>`; }).join("")}</div>`,
    };
  },

  mode() {
    const desc = { rule: `按 <b>${ROUTES.reduce((a, r) => a + r.nrules, 0)} 条规则</b>把流量分到 ${ROUTES.length} 个路由组；没命中的走默认。`, global: "<b>所有流量</b>都走当前出口，规则暂不生效。", direct: "<b>所有流量直接连接</b>，不经过任何节点。" }[S.mode];
    const words = [["rule", "规则"], ["global", "全局"], ["direct", "直连"]];
    return {
      normal: `<div class="pad"><span class="hint">展开</span><div class="kicker" data-m="k-mode">模式</div>
        <div class="words">${words.map(([id, l]) => `<button class="word ${S.mode === id ? "on" : ""} ${busy("mode:" + id) ? "shimmer" : ""}" data-mode="${id}">${l}${S.mode === id ? '<span class="ul" data-m="mode-ul" data-mbox></span>' : ""}</button>`).join("")}</div>
        <p class="note">${desc}</p>${devMissing().length ? `<button class="dv-card" data-dv-card>${devMissing().length} 个开发工具未接入流量 ›</button>` : ""}</div>`,
      compact: (v) => cmp(v, "mode", "模式", words.find((w) => w[0] === S.mode)[1], { sub: { rule: `${ROUTES.reduce((a, r) => a + r.nrules, 0)} 条规则 · ${ROUTES.length} 个路由组`, global: "所有流量走默认出口", direct: "不经过任何节点" }[S.mode] }),
      detail: `<div class="det">${detHead("模式", "模式与开发工具", "", "k-mode")}<div class="det-b">
        ${[["rule", "规则", "按规则把流量分到不同路由。日常就用这个。"], ["global", "全局", "所有流量都走「默认」路由的出口，规则暂停。临时需要时用。"], ["direct", "直连", "所有流量直接连接，不经过任何节点。排查网络问题时用。"]].map(([id, l, d]) => `
          <div class="dsec"><h4>${l}<small>${S.mode === id ? "当前" : ""}</small></h4><div class="muted" style="font-size:12.5px">${d}</div><button class="btn" data-mode="${id}">${busy("mode:" + id) ? '<span class="shimmer">切换中…</span>' : S.mode === id ? "✓ 使用中" : "切换"}</button></div>`).join("")}
        ${devSection()}</div></div>`,
    };
  },

  takeover() {
    const sysOn = S.entries.sys && S.state !== "off", tunOn = S.entries.tun && S.state !== "off";
    const names = [sysOn && "系统代理", tunOn && "TUN"].filter(Boolean);
    return {
      normal: `<div class="pad"><span class="hint">展开</span><div class="kicker" data-m="k-takeover">接管</div><div style="margin-top:6px">${entryWord("sys", "系统代理")}${entryWord("tun", "TUN")}</div></div>`,
      compact: (v) => cmp(v, "takeover", "接管", names.length ? names.join(" + ") : "未接管", {
        cls: (busy("entry:sys") || busy("entry:tun") ? "shimmer " : "") + (S.state === "error" ? "bad" : ""),
        sub: S.state === "error" ? "被其他程序改掉了" : names.length ? "生效中" : "",
        list: `<span>端口 7899</span><span>局域网 ${S.lan ? "允许" : "不允许"}</span>` }),
      detail: `<div class="det">${detHead("接管", "接管方式", "", "k-takeover")}<div class="det-b">
        <div class="dsec"><h4><span data-m="tk-sys">系统代理</span><small>浏览器和大多数应用</small></h4>
          <div class="kv"><span>状态</span><span>${busy("entry:sys") ? '<span class="shimmer">正在应用…</span>' : sysOn ? (S.state === "error" ? '<b style="color:var(--signal)">被其他程序改掉了</b>（现在指向 127.0.0.1:1087）' : '<b style="color:var(--good)">生效中</b> · Wi-Fi、以太网') : "未使用"}</span>
            <span>地址</span><span class="num">HTTP / HTTPS / SOCKS → 127.0.0.1:7899</span>
            <span>自检</span><span>每 5 秒确认系统代理仍指向 Moho</span>
            <span>不走代理</span><span>localhost, 127.0.0.1, *.local, 192.168.0.0/16 <u>编辑</u></span></div>
          <button class="toggle ${sysOn ? "on" : ""} ${busy("entry:sys") ? "busy" : ""}" data-entry="sys"></button></div>
        <div class="dsec"><h4><span data-m="tk-tun">TUN</span><small>所有应用，包括不认系统代理的</small></h4>
          <div class="kv"><span>状态</span><span>${busy("entry:tun") ? `<span class="shimmer">${S.tunInstalled ? "正在启用…" : "正在安装提权服务，请在系统弹窗中确认…"}</span>` : tunOn ? '<b style="color:var(--good)">生效中</b> · utun9' : S.tunInstalled ? "未使用" : "未使用 · 需要先安装一次提权服务"}</span>
            <span>协议栈</span><span>mixed（gVisor + system）</span><span>DNS</span><span>劫持 53 端口 · fake-ip</span></div>
          <button class="toggle ${tunOn ? "on" : ""} ${busy("entry:tun") ? "busy" : ""}" data-entry="tun"></button></div>
        <div class="dsec"><h4>本地端口<small>给手动配置的应用用</small></h4>
          <div class="kv"><span>混合端口</span><span class="num">7899 · HTTP 和 SOCKS5</span><span>局域网</span><span>${S.lan ? "允许 · 192.168.1.23:7899" : "不允许"}</span></div>
          <button class="toggle ${S.lan ? "on" : ""}" data-lan></button></div>
      </div></div>`,
    };
  },

  routes() {
    const others = ROUTES.filter((r) => r.id !== "default");
    const sub = S.sub && route(S.sub);
    return {
      normal: `<div class="pad"><span class="hint">展开</span><div class="kicker" data-m="k-routes">其他路由组</div><div style="margin-top:6px">${(others.length > 4 ? others.slice(0, 3) : others).map((r) => { const n = r.direct ? null : node(r.node); return `
        <button class="route ${active(r.id) ? "" : "dim"}" data-expand="routes" ${r.direct ? "" : `data-sub="${r.id}"`}>
          <span class="sw" style="background:var(${r.color})"></span><span class="rn" data-m="rn-${r.id}">${r.name}</span>
          <span class="exw"><span class="ex ${busy("node:" + r.id) ? "shimmer" : ""}" data-m="exit-${r.id}">${n ? exitText(r) : "直接连接"}</span>${viaSmall(r)}</span>
          <span class="ms num">${n ? (devSwap() && r.id === "dev" ? `<span style="color:var(--warn)">已换 · </span>` : "") + msWord(r) : "国内 · 局域网"}</span></button>`; }).join("")}${others.length > 4 ? `<button class="route" data-expand="routes"><span></span><span class="muted" style="grid-column:2 / -1;font-size:12px">还有 ${others.length - 3} 个路由组</span></button>` : ""}</div></div>`,
      compact: (v) => {
        const px = others.filter((r) => !r.direct);
        const dots = px.map((r) => `<span class="sw" style="background:var(${r.color})"></span>`).join(" ");
        const inline = px.map((r) => `<span class="sw" style="background:var(${r.color})"></span> ${r.name} → ${exitPlain(r)}`).join("　");
        if (v === "strip") return `<div class="cmp strip"><span class="k" data-m="k-routes">其他路由组</span><span class="vl rlist-inline">${inline}</span></div>`;
        return cmp(v, "routes", "其他路由组", `${dots}<span class="cnt">${px.length} 个</span>`, {
          list: px.map((r) => `<span><span class="sw" style="background:var(${r.color})"></span> ${r.name}<br><b>${exitText(r)}</b></span>`).join("") });
      },
      detail: sub
        ? `<div class="det">${detHead(`<button class="back" data-sub-back>‹ 路由组</button>`, `<span class="sw" style="background:var(${sub.color});width:10px;height:10px"></span><span data-m="rn-${sub.id}">${sub.name}</span> → <span class="${busy("node:" + sub.id) ? "shimmer" : ""}" ${sub.id === "default" ? "" : `data-m="exit-${sub.id}"`}>${exitText(sub)}</span>`, autoSeg(sub.id), "k-routes")}<div class="det-b">${nodePicker(sub.id)}</div></div>`
        : `<div class="det">${detHead("路由组", "每类流量走哪里", `<button class="btn" data-go-rg>管理路由组</button>`, "k-routes")}<div class="det-b"><div class="rlist">
          ${ROUTES.map((r) => { const n = r.direct ? null : node(r.node); return `
            <button class="rr" style="width:100%" ${r.direct ? "" : `data-sub-open="${r.id}"`}>
              <span class="sw" style="background:var(${r.color});width:10px;height:10px"></span><span class="rn" data-m="rn-${r.id}">${r.name}</span>
              <span class="rules">${r.id === "default" ? r.rules : `${r.nsvc} 个服务 · ${r.rules}`}</span>
              <span class="exw"><span class="ex ${busy("node:" + r.id) ? "shimmer" : ""}" ${r.id === "default" ? "" : `data-m="exit-${r.id}"`}>${n ? `${exitText(r)}` : "直接连接"}</span>${viaSmall(r)}</span>
              <span class="num" style="color:${n && !r.broken ? tone(n.ms) : "var(--mute)"}">${n ? msWord(r) : "—"}</span>
              <span class="num muted">${Math.round(r.share * 100)}%</span><span class="muted">${r.direct ? "" : "›"}</span></button>`; }).join("")}
        </div></div></div>`,
    };
  },

  speed() {
    const off = !takeoverOn(), last = hist.at(-1);
    const [dv, du] = off ? ["0", "KB"] : unit(down(last)), [uv, uu] = off ? ["0", "KB"] : unit(last.up);
    return {
      normal: `<div class="pad now-pad"><span class="hint">展开</span><div class="kicker" data-m="k-speed">此刻速度</div>
        <div class="speed" id="speed" data-m="spd">${speedHTML(dv, du, uv, uu)}</div>
        <canvas class="spark" id="spark"></canvas>
        <div class="foot num"><span>今日 2.31 GB · 本月 48.6 GB</span><span>颜色 = 路由组</span></div></div>`,
      compact: (v) => cmp(v, "speed", "此刻速度", `<span id="speed-c">↓ ${dv} ${du}/s</span>`, { key: "spd", cls: "num", sub: `↑ ${uv} ${uu}/s · 今日 2.31 GB` }),
      detail: `<div class="det">${detHead("流量", "按路由组看流量", `<div class="seg"><button>1 分钟</button><button class="on">10 分钟</button><button>1 小时</button><button>24 小时</button></div>`, "k-speed")}
        <div class="det-b"><canvas class="big-chart" id="big"></canvas>
        <div class="rlist" style="margin-top:8px">${ROUTES.map((r) => `<div class="rr" style="grid-template-columns:10px 90px 1fr 100px 100px 60px"><span class="sw" style="background:var(${r.color})"></span><span class="rn" style="font-size:14px">${r.name}</span><span class="bar"><i style="width:${r.share * 100}%;background:var(${r.color})"></i></span><span class="num">↓ ${fmt(2.31e9 * r.share)}</span><span class="num muted">↑ ${fmt(1.86e8 * r.share)}</span><span class="num muted">${Math.round(r.share * 100)}%</span></div>`).join("")}</div></div></div>`,
    };
  },

  apps() {
    const max = Math.max(...APPS.map((a) => a[3]));
    return {
      normal: `<div class="pad now-pad"><span class="hint">展开</span><div class="kicker" data-m="k-apps">谁在用</div>
        <div class="apps">${APPS.slice(0, 4).map(([n, h, r, v]) => `<div class="app" style="opacity:${active(r) ? 1 : .35}"><span class="an"><span data-m="app-${n}">${n}</span><small>${h}</small></span><span class="bar"><i style="width:${(v / max) * 100}%;background:var(${route(r).color})"></i></span><span class="av num">${active(r) ? fmt(v, "/s") : "—"}</span></div>`).join("")}</div>
        <div class="foot"><span>${CONNS.filter((c) => c.status === "active").length + 48} 个连接</span><span>点开查看全部</span></div></div>`,
      compact: (v) => cmp(v, "apps", "谁在用", APPS[0][0], { key: `app-${APPS[0][0]}`, sub: `${fmt(APPS[0][3], "/s")} · 共 ${CONNS.filter((c) => c.status === "active").length + 48} 个连接`,
        list: APPS.slice(1, 4).map(([n, , , r]) => `<span>${n}　<span class="muted num">${fmt(r, "/s")}</span></span>`).join("") }),
      detail: `<div class="det">${detHead("谁在用", "应用", `<button class="btn" data-page="activity">在日志中查看 →</button>`, "k-apps")}<div class="det-b"><div class="rlist">
        ${APPS.map(([n, h, r, v, c]) => `<button class="rr" style="width:100%;grid-template-columns:1fr 1.4fr 140px 90px 70px 14px" data-goapp="${n}">
          <span class="rn" style="font-size:15px" data-m="app-${n}">${n}</span><span class="rules">${h}</span>
          <span class="bar"><i style="width:${(v / max) * 100}%;background:var(${route(r).color})"></i></span>
          <span class="num">${fmt(v, "/s")}</span><span class="muted num">${c} 连接</span><span class="muted">›</span></button>`).join("")}</div></div></div>`,
    };
  },

  events() {
    return {
      normal: `<div class="pad now-pad"><span class="hint">展开</span><div class="kicker" data-m="k-events">刚刚</div><div class="ticker" id="ticker">${tickerHTML(5)}</div></div>`,
      compact: (v) => cmp(v, "events", "刚刚", v === "strip" ? `<span id="ticker-c">${tickerItems[0]?.[1] || ""}</span>` : "实时", {
        short: "实时", sub: v === "strip" ? tickerItems[0]?.[2] || "" : "",
        list: tickerItems.slice(0, 4).map((t) => `<span>${t[1]}</span>`).join("") }),
      detail: `<div class="det">${detHead("刚刚", "实时事件", `<span class="live ${S.act.paused ? "paused" : ""}"><i></i>${S.act.paused ? "已暂停" : "实时"}</span><button class="btn" data-pause>${S.act.paused ? "继续" : "暂停"}</button><button class="btn" data-acttab="log">完整日志 →</button>`, "k-events")}
        <div class="det-b"><div class="ticker" id="ticker-d" style="gap:7px;font-size:12px">${tickerHTML(30)}</div></div></div>`,
    };
  },
};
const speedHTML = (dv, du, uv, uu) => `<span class="v num">↓ ${dv}<small>${du}/s</small></span><span class="v u num">↑ ${uv}<small>${uu}/s</small></span>`;

// The three strategies: the same control on 代理's expanded row and in the 路由组 tab.
function stratSeg(rid) {
  const r = route(rid);
  return `<div class="seg">${Object.keys(STRATEGY).map((k) => `<button class="${r.p.mode === k ? "on" : ""}" data-strat="${rid}|${k}">${STRATEGY[k]}</button>`).join("")}</div>`;
}
const autoSeg = (rid) => `<button class="btn" data-go-rg="${rid}">服务和规则</button>${stratSeg(rid)}`;

// 自动最快's range: which nodes the fastest is picked from. Empty means all.
function scopeHTML(r) {
  const p = r.p, live = NODES.filter((n) => !gone(n));
  const fromP = live.filter((n) => !p.providers.length || p.providers.includes(n.prov));
  const fromR = live.filter((n) => !p.regions.length || p.regions.some((x) => inRegion(n, x)));
  const chip = (kind, val, on, label, n) => `<button class="${on ? "on" : ""}" data-scope="${r.id}|${kind}|${val}">${label}${n === undefined ? "" : ` <em>${n}</em>`}</button>`;
  return `<div class="scope"><span class="lb">地区</span><div class="gchips">${chip("regions", "", !p.regions.length, "全部")}${REGIONS.map(([id, f, l]) => chip("regions", id, p.regions.includes(id), `${f} ${l}`, fromP.filter((n) => inRegion(n, id)).length)).join("")}</div>
    <span class="lb">来源</span><div class="gchips">${chip("providers", "", !p.providers.length, "全部")}${PROVIDERS.filter((x) => !x.off).map((x) => chip("providers", x.id, p.providers.includes(x.id), x.expired ? `${x.name} · 已到期` : x.name, fromR.filter((n) => n.prov === x.id).length)).join("")}</div></div>`;
}

const REGION_TABS = [["all", "全部"], ["HK", "🇭🇰 香港"], ["JP", "🇯🇵 日本"], ["SG", "🇸🇬 新加坡"], ["US", "🇺🇸 美国"], ["?", "◌ 未知"]];
function toolRow(rid, withTabs) {
  const testing = busy("test:" + rid);
  return `<div class="toolrow"><div class="chips">${withTabs ? REGION_TABS.map(([id, l]) => `<button class="${S.nd.region === id ? "on" : ""}" data-region="${id}">${l}</button>`).join("") : ""}</div>
      <div class="right"><input class="search" id="nd-q" placeholder="搜索节点" value="${esc(S.nd.q)}" style="width:120px" /><button class="btn" data-test="${rid}">${testing ? '<span class="shimmer">测速中…</span>' : "全部测速"}</button></div></div>`;
}
function nodeCols(rid, n) {
  const testing = busy("test:" + rid);
  return `<span class="bars">${testing ? `<span class="skel" style="width:60px;height:12px;display:block"></span>` : stab(n.ms, 10, 14)}</span>

// ==================================================================
// Motion: shared elements without cross-fades.
//
// Elements that mean the same thing carry the same data-m key in every
// view. morph(update) measures the visible keyed elements, applies the
// update, measures again at the final layout (the grid's end state), then
// flies a live-text clone of each element from where it was to where it
// will be — font size, color and letter spacing interpolate per frame, so
// text is re-laid out, never a scaled bitmap. The real element stays
// hidden until its clone lands. Text that changed in place rolls instead.
// ==================================================================
const EASE = "cubic-bezier(.32,.86,.22,1)", DUR = 560;

function shownView(el) {
  const vw = el.closest(".vw"); if (!vw) return true;
  const v = vw.closest(".cell")?.dataset.v;
  return (v === "normal" && vw.classList.contains("v-normal")) || (v === "compact" && vw.classList.contains("v-compact")) || (v === "expanded" && vw.classList.contains("v-detail"));
}

function snap() {
  const sr = $("stage").getBoundingClientRect(), z = sr.width / 1440;
  const m = new Map();
  document.querySelectorAll("#page [data-m]").forEach((el) => {
    if (!el.dataset.m || !shownView(el)) return;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    // Skip what the cell clips away entirely.
    const cell = el.closest(".cell");
    if (cell) { const c = cell.getBoundingClientRect(); if (r.top >= c.bottom - 2 || r.left >= c.right - 2) return; }
    const cs = getComputedStyle(el), fs = parseFloat(cs.fontSize);
    m.set(el.dataset.m, {
      el, x: (r.left - sr.left) / z, y: (r.top - sr.top) / z, w: r.width / z, h: r.height / z,
      text: el.textContent.replace(/\s+/g, ""), html: el.innerHTML, cls: el.className,
      fs, lh: (parseFloat(cs.lineHeight) / fs) || 1.2, font: cs.fontFamily, weight: cs.fontWeight,
      color: cs.color, ls: cs.letterSpacing, bg: cs.backgroundColor, box: el.hasAttribute("data-mbox"),
    });
  });
  return m;
}

function cloneAt(s, html) {
  const c = document.createElement("div");
  c.className = s.cls; c.innerHTML = html;
  c.querySelectorAll("[id],[data-m]").forEach((e) => { e.removeAttribute("id"); e.removeAttribute("data-m"); });
  Object.assign(c.style, {
    position: "absolute", left: s.x + "px", top: s.y + "px", margin: 0, padding: getComputedStyle(s.el).padding,
    whiteSpace: "nowrap", fontFamily: s.font, fontWeight: s.weight, fontSize: s.fs + "px", lineHeight: s.lh,
    color: s.color, letterSpacing: s.ls, viewTransitionName: "none", visibility: "visible", pointerEvents: "none",
    boxShadow: "none", border: 0, background: s.box ? s.bg : "none",
  });
  if (s.box) { c.style.width = s.w + "px"; c.style.height = s.h + "px"; }
  $("fx").append(c);
  return c;
}

const frameOf = (s) => ({ left: s.x + "px", top: s.y + "px", fontSize: s.fs + "px", color: s.color, letterSpacing: s.ls, ...(s.box ? { width: s.w + "px", height: s.h + "px", backgroundColor: s.bg } : {}) });

function fly(o, a) {
  const moved = Math.abs(o.x - a.x) > 1 || Math.abs(o.y - a.y) > 1 || Math.abs(o.fs - a.fs) > .5 || (a.box && Math.abs(o.w - a.w) > 1);
  const same = o.text === a.text;
  if (!moved && same) return;
  if (!moved) return roll(o, a);
  const c = cloneAt(a, a.html);
  a.el.style.visibility = "hidden";
  const done = () => { c.remove(); a.el.style.visibility = ""; };
  c.animate([frameOf(o), frameOf(a)], { duration: DUR, easing: EASE }).onfinish = done;
  if (!same) {
    // The old words wipe away where they were; the new ones wipe in as they travel.
    const oc = cloneAt(o, o.html);
    oc.animate([{ clipPath: "inset(0 0 0 0)", transform: "none" }, { clipPath: "inset(0 0 100% 0)", transform: "translateY(-30%)" }], { duration: 220, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" }).onfinish = () => oc.remove();
    c.animate([{ clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0 0 0 0)" }], { duration: 300, delay: 80, easing: EASE, fill: "backwards" });
  }
}

// Same place, new text: the old line slides up and out of a mask, the
// new one slides up into it.
function roll(o, a) {
  const oc = cloneAt(o, o.html);
  oc.animate([{ transform: "none", clipPath: "inset(0 0 0 0)" }, { transform: "translateY(-45%)", clipPath: "inset(0 0 100% 0)" }], { duration: 260, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" }).onfinish = () => oc.remove();
  a.el.animate([{ transform: "translateY(45%)", clipPath: "inset(100% 0 0 0)" }, { transform: "none", clipPath: "inset(0 0 0 0)" }], { duration: 420, delay: 90, easing: EASE, fill: "backwards" });
}

function morph(update, prep) {
  const b = $("board");
  if (S.page !== "home" || !b) { update(); return; }
  prep && prep();
  const before = snap();
  const oc = b.style.gridTemplateColumns, or = b.style.gridTemplateRows;
  b.style.transition = "none";
  update();
  const nc = b.style.gridTemplateColumns, nr = b.style.gridTemplateRows;
  void b.offsetHeight;
  const after = snap();
  if (oc !== nc || or !== nr) {
    // Measure the end layout, then go back and let the grid animate to it.
    b.style.gridTemplateColumns = oc; b.style.gridTemplateRows = or; void b.offsetHeight;
    b.style.transition = "";
    b.style.gridTemplateColumns = nc; b.style.gridTemplateRows = nr;
  } else b.style.transition = "";
  for (const [k, a] of after) { const o = before.get(k); if (o) fly(o, a); }
}

function expand(id, sub = null) {
  if (!takeoverOn()) return;
  if (S.x === id && S.sub === sub) return;
  morph(() => { S.x = id; S.sub = sub; S.nd = ndFor(id === "hero" ? "default" : sub); render(); });
}
function collapse() { if (!S.x) return; morph(() => { S.x = null; S.sub = null; render(); }); }

// Takeover changes that cross between "on" and "off" reshape the board,
// so they morph the grid and the headline together.
function toggleEntry(id) {
  const on = S.entries[id] && S.state !== "off";
  const slow = id === "tun" && !S.tunInstalled && !on;
  S.pending["entry:" + id] = true; render();
  setTimeout(() => morph(() => {
    if (id === "tun" && !on) S.tunInstalled = true;
    if (S.state === "off") { S.entries = { sys: false, tun: false }; S.state = "ok"; }
    S.entries[id] = !on;
    if (S.state === "error" && id === "sys") S.state = "ok";
    if (!S.entries.sys && !S.entries.tun) { S.state = "off"; S.x = null; S.sub = null; }
    delete S.pending["entry:" + id];
    render();
  }), slow ? 2000 : 900);
}

function pickNode(rid, nid, rowEl) {
  const r = route(rid);
  if (r.p.mode === "fixed" && r.p.fixed === nid) return;
  morph(() => {
    viewCache.clear(); // restore the keys prep() moved
    r.p.mode = "fixed"; r.p.fixed = nid; r.node = nid;
    S.pendingNode = nid; S.pending["node:" + rid] = true;
    render();
  }, () => {
    // The clicked name becomes the title: hand the shared identity over.
    document.querySelectorAll(`[data-m="exit-${rid}"]`).forEach((e) => e.removeAttribute("data-m"));
    const nm = rowEl?.querySelector(".nm"); if (nm) nm.dataset.m = `exit-${rid}`;
  });
  setTimeout(() => {
    delete S.pending["node:" + rid]; render();
    const n = node(nid);
    if (n.src === "unknown") { locStart = Date.now(); setTimeout(() => { n.place = n.real; n.src = "probe"; render(); }, 2200); }
  }, 1100);
}

// Any change that may move a route group to another node shimmers its exit
// while the new one is being reached.
function settle(rid, before) {
  if (route(rid).node === before || route(rid).broken) return;
  S.pendingNode = route(rid).node; S.pending["node:" + rid] = true; render();
  setTimeout(() => { delete S.pending["node:" + rid]; render(); }, 800);
}
function changePolicy(rid, fn) {
  const r = route(rid), before = r.node;
  morph(() => { fn(r.p, r); render(); });
  settle(rid, before);
}
function setStrategy(rid, mode) {
  const r = route(rid);
  if (r.p.mode === mode) return;
  S.nd = ndFor();
  changePolicy(rid, (p) => {
    if (mode === "fixed" && !p.fixed) p.fixed = r.node;
    if (mode === "order" && !p.order.length) p.order = [r.node];
    p.mode = mode;
  });
}

// A simulated outage: what moved is said in the news bar.
function simulate(fn) {
  const was = new Map(ROUTES.map((r) => [r.id, r.node]));
  fn();
  morph(() => {
    resolveRoutes();
    const moved = ROUTES.filter((r) => !r.direct && !r.broken && r.node !== was.get(r.id) && !alive(node(was.get(r.id))));
    const r = moved[0];
    S.notice = r ? `「${esc(r.name)}」的 ${node(was.get(r.id)).name} 不可用，已换到${r.p.mode === "order" ? `第 ${r.at} 位的 ` : " "}${node(r.node).name}${moved.length > 1 ? `，另有 ${moved.length - 1} 个路由组也换了` : ""}。` : null;
    render();
  });
}

function setMode(m) {
  if (S.mode === m) return;
  morph(() => { S.mode = m; S.pending["mode:" + m] = true; render(); });
  setTimeout(() => { delete S.pending["mode:" + m]; render(); }, 500);
}

    SERVICES.splice(SERVICES.indexOf(svc(d.sDel)), 1); S.set.armed = null; S.set.svc = null; return morph(render);
  }
  if (d.rOff) { const [sid, i] = d.rOff.split("|"), u = svc(sid).rules[+i]; u.off = !u.off; return render(); }
  if (d.rDel) { const [sid, i] = d.rDel.split("|"); svc(sid).rules.splice(+i, 1); return render(); }
  if (d.rAdd) return addRule(d.rAdd);
  if (d.cfMove) {
    const { t, from } = S.set.conflict, x = from.rules.findIndex((u) => u.kind === t.kind && u.value === t.value);
    from.rules.splice(x, 1); svc(d.cfMove).rules.unshift(t); clearRuleDraft();
    return morph(render);
  }
  if (d.cfX !== undefined) { S.set.conflict = null; return render(); }
  if (d.region) { S.nd.region = d.region; return morph(render); }
  if (d.test) return apply("test:" + d.test, 1500, () => NODES.forEach((n) => { if (n.ms > 0) n.ms = Math.round(n.ms * (0.9 + Math.random() * .2)); }));
  if (d.lan !== undefined) { S.lan = !S.lan; return morph(render); }
  if (d.fix !== undefined) return apply("fix", 1100, () => { S.state = "ok"; });
  if (d.acttab) { S.page = "activity"; S.x = null; S.act.tab = d.acttab; S.act.q = ""; return render(); }
  if (d.astatus) { S.act.status = d.astatus; S.act.armed = false; return render(); }
  if (d.aroute) { S.act.route = d.aroute; S.act.armed = false; return render(); }
  if (d.sort) { const [k, dir] = S.act.sort; S.act.sort = [d.sort, k === d.sort ? -dir : -1]; return render(); }
  if (d.kill) { e.stopPropagation(); const c = CONNS.find((x) => x.id === +d.kill); c.status = "closed"; c.rate = 0; return render(); }
  if (d.conn) { S.act.open = S.act.open === +d.conn ? null : +d.conn; return render(); }
  if (d.pause !== undefined) { S.act.paused = !S.act.paused; return render(); }
  if (d.closeall !== undefined) {
    if (!S.act.armed) { S.act.armed = true; setTimeout(() => { S.act.armed = false; render(); }, 3000); return render(); }
    filtered().forEach((c) => { if (c.status === "active") { c.status = "closed"; c.rate = 0; } }); S.act.armed = false; return render();
  }
  if (d.lv) { S.act.lv = d.lv; return render(); }
  if (d.upd) return apply("upd:" + d.upd, 1500, () => { prov(d.upd).upd = "刚刚"; });
  if (d.updall !== undefined) return apply("updall", 1800, () => PROVIDERS.forEach((p) => { if (p.total) p.upd = "刚刚"; }));
  if (d.provoff) { const p = prov(d.provoff); p.off = !p.off; return render(); }
  if (d.add !== undefined) return apply("add", 1400, () => {});
  if (d.goapp) { S.page = "activity"; S.x = null; S.act.tab = "conn"; S.act.app = d.goapp; S.act.status = "all"; return render(); }
  if (d.prov) { S.prov.open = S.prov.open === d.prov ? null : d.prov; return render(); }
  if (d.dvQuit) {
    const k = d.dvQuit;
    if (k === "open") S.dev.quit = devAtRisk().length ? "ask" : "none";
    else if (k === "close") S.dev.quit = null;
    else { if (k === "undo") devAtRisk().filter((t) => !t.restartBtn).forEach(devRestore); S.dev.quit = "done"; }
    return render();
  }
  if (d.dvCard !== undefined) { e.stopPropagation(); S.dev.list = true; return expand("mode"); }
  if (d.dvList !== undefined) { S.dev.list = !S.dev.list; S.dev.ask = null; render(); if (S.dev.list) document.querySelector(".dv-sum")?.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
  if (d.dvOpen) { S.dev.open = S.dev.open === d.dvOpen ? null : d.dvOpen; S.dev.ask = null; return render(); }
  if (d.dvAsk) { const [id, kind] = d.dvAsk.split("|"); if (kind === "undo" && !devItem(id).restartBtn) { S.dev.open = id; return devDo(id, "undo"); } S.dev.open = id; S.dev.ask = kind; return render(); }
  if (d.dvCancel !== undefined) { S.dev.ask = null; return render(); }
  if (d.dvDo) { const [id, kind] = d.dvDo.split("|"); return devDo(id, kind); }
  if (d.dvTest) return devTest(d.dvTest);
  if (d.dvRecheck !== undefined) return apply("dvre", 1200, () => {});
  if (d.dvUndoall !== undefined) {
    const restarts = S.dev.items.some((t) => t.src === "bowel" && t.restartBtn);
    if (restarts && !S.dev.armed) { S.dev.armed = true; setTimeout(() => { S.dev.armed = false; render(); }, 3000); return render(); }
    S.dev.armed = false; S.dev.ask = null;
    return apply("dvall", restarts ? 1800 : 1000, () => S.dev.items.forEach((t) => { if (t.src === "bowel") devRestore(t); }));
  }
});
function onInput(e) {
  const id = e.target.id;
  if (id === "aq") { S.act.q = e.target.value; S.act.armed = false; if ($("atbl")) $("atbl").innerHTML = connTable(); if ($("ltbl")) $("ltbl").innerHTML = logRows(); }
  if (id === "nd-q") { S.nd.q = e.target.value; render(); }
  if (id === "g-name") {
    const r = route(S.set.group), v = e.target.value;
    S.set.draft = v; S.set.err = groupNameError(v, r);
    if (!S.set.err) r.name = v.trim();
    render();
  }
  if (id === "s-name") {
    const s = svc(S.set.svc), v = e.target.value;
    S.set.sdraft = v; S.set.serr = serviceNameError(v, s);
    if (!S.set.serr) s.name = v.trim();
    render();
  }
  if (id === "rule-text") { S.set.text = e.target.value; S.set.rerr = ""; S.set.conflict = null; render(); }
  if (id === "rs-text") { S.rs.text = e.target.value; rsCheck(); render(); }
  if (id === "addr-test") { S.set.test = e.target.value; render(); }
  if (id === "addp") {
    const v = e.target.value.trim(), m = /^(vmess|vless|trojan|ss|ssr|hysteria2?|hy2|tuic|wireguard|anytls):\/\//i.exec(v);
    $("detect").innerHTML = !v ? "自动识别：订阅（Clash / mihomo / Base64）、单个节点链接、YAML 文件。" : m ? `识别为 <b>节点链接 · ${m[1].toUpperCase()}</b>，会作为一个单独的 Provider 加入；添加后实测出口位置。` : /^https?:\/\//.test(v) ? `识别为 <b>订阅</b>，添加后读取节点、流量和到期时间，默认每 12 小时更新。` : "无法识别，请检查内容。";
  }
}
document.addEventListener("input", (e) => { if (!e.isComposing) onInput(e); });
document.addEventListener("compositionend", onInput);
document.addEventListener("change", (e) => {
  if (e.target.id === "aapp") { S.act.app = e.target.value; render(); }
  if (e.target.id === "anet") { S.act.net = e.target.value; render(); }
  if (e.target.id === "rule-kind") { S.set.kind = e.target.value; S.set.rerr = ""; S.set.conflict = null; render(); }
  if (e.target.id === "del-to") { S.set.delTo = e.target.value; render(); }
  const d = e.target.dataset;
  if (d.sMove && e.target.value) { svc(d.sMove).group = e.target.value; S.set.svc = null; morph(render); }
  if (d.sPull && e.target.value) { svc(e.target.value).group = d.sPull; S.set.svc = e.target.value; clearRuleDraft(); morph(render); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "rule-text" && !e.isComposing) addRule(S.set.svc);
  if (e.key === "Escape") { if (S.set.open) { S.set.open = false; render(); } else collapse(); }
  if (e.key === "," && e.metaKey) { e.preventDefault(); S.set.open = true; render(); }
});
// The settings window drags by its title bar, as a window does.
document.addEventListener("mousedown", (e) => {
  if (!e.target.closest(".sw-h, .sw-drag") || e.target.closest("button, i[data-sw-close]")) return;
  const w = $("sw"), z = $("stage").getBoundingClientRect().width / 1440, x0 = e.clientX, y0 = e.clientY, l = w.offsetLeft, t = w.offsetTop;
  const move = (m) => { w.style.left = l + (m.clientX - x0) / z + "px"; w.style.top = t + (m.clientY - y0) / z + "px"; };
  const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
  addEventListener("mousemove", move); addEventListener("mouseup", up);
});

function fit() { $("stage").style.transform = `scale(${Math.min(innerWidth / 1440, innerHeight / 900)})`; }
addEventListener("resize", fit);

setInterval(() => {
  hist.push(sample(tickN++)); hist.shift();
  if (S.act.paused) return;
  pushTicker();
  if (S.page === "home" && $("board")) {
    const tk = $("ticker"); if (tk) tk.innerHTML = tickerHTML(5);
    const tkd = $("ticker-d"); if (tkd) tkd.innerHTML = tickerHTML(30);
    const tkc = $("ticker-c"); if (tkc) tkc.textContent = tickerItems[0]?.[1] || "";
    if (takeoverOn()) {
      const last = hist.at(-1); const [dv, du] = unit(down(last)), [uv, uu] = unit(last.up);
      if ($("speed")) $("speed").innerHTML = speedHTML(dv, du, uv, uu);
      if ($("speed-c")) $("speed-c").textContent = `↓ ${dv} ${du}/s`;
    }
    drawSpark();
    if (S.x === "speed") drawBig();
  }
  if (S.page === "activity" && S.act.tab === "conn") {
    CONNS.forEach((c) => { if (c.status === "active") { c.rate = Math.max(0, c.rate * (0.7 + Math.random() * .6)); c.dl += c.rate; c.dur += 1; } });
    const tb = $("atbl"); if (tb) { const s = tb.scrollTop; tb.innerHTML = connTable(); tb.scrollTop = s; }
  }
}, 1000);

fit();
if (location.hash === "#ruleset") { S.page = "routes"; S.set.group = "ai"; }
render();

</script>
